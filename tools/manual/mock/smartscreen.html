<!doctype html><html lang="ko"><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>.dlg{position:absolute;left:170px;top:70px;width:620px;background:#1F5FA8;color:#fff;box-shadow:0 12px 40px rgba(0,0,0,.4);border-radius:6px;overflow:hidden}
.dlg .in{padding:34px 40px 28px}.dlg h1{font-size:30px;font-weight:700;margin-bottom:18px}.dlg p{font-size:20px;line-height:1.5}
.dlg a{color:#fff;text-decoration:underline;font-size:20px;display:inline-block;margin-top:14px}
.btns{display:flex;justify-content:flex-end;gap:14px;padding:0 40px 30px}.b{padding:12px 30px;background:#fff;color:#1F5FA8;font-size:20px;font-weight:600;border:2px solid #fff}
.b.g{background:transparent;color:#fff}.info{font-size:20px;margin-top:18px;line-height:1.7}</style>
<body><div id="stage"><div class="dlg" id="d1"><div class="in"><h1>Windows의 PC 보호</h1>
<p>Microsoft Defender SmartScreen에서 인식할 수 없는 앱의 시작을 차단했습니다. 이 앱을 실행하면 PC가 위험에 노출될 수 있습니다.</p>
<a data-callout="more">추가 정보</a></div><div class="btns"><span class="b g">실행 안 함</span></div></div>
<div class="dlg" id="d2" style="display:none"><div class="in"><h1>Windows의 PC 보호</h1>
<p>Microsoft Defender SmartScreen에서 인식할 수 없는 앱의 시작을 차단했습니다. 이 앱을 실행하면 PC가 위험에 노출될 수 있습니다.</p>
<div class="info">앱: AI탐험대.exe<br>게시자: 알 수 없는 게시자</div></div>
<div class="btns"><span class="b" data-callout="run">실행</span><span class="b g">실행 안 함</span></div></div></div>
<script>if(new URLSearchParams(location.search).get('step')==='2'){d1.style.display='none';d2.style.display='block';d2.style.top='60px'}
document.querySelectorAll('[data-callout]').forEach(e=>{if(e.closest('.dlg').style.display==='none')e.removeAttribute('data-callout')})</script></body></html>
